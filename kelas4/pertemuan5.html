<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modul & Kuis Interaktif TIK Kelas 4 SD</title>
    <style>
        :root {
            --primary: #4285f4;
            --bg-color: #f8f9fa;
            --border-color: #dadce0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            line-height: 1.6;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 100;
        }

        .header-title h1 {
            font-size: 1.2rem;
        }

        .header-title p {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .main-layout {
            display: flex;
            flex: 1;
            height: calc(100vh - 55px);
            overflow: hidden;
        }

        /* Panel Kiri & Kanan (Iframe Containers) */
        .left-panel, .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #ffffff;
        }

        .left-panel {
            border-right: 2px solid var(--border-color);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Responsive Layout untuk Layar HP / Tablet */
        @media (max-width: 900px) {
            body {
                overflow: auto;
            }
            .main-layout {
                flex-direction: column;
                height: auto;
            }
            .left-panel, .right-panel {
                height: 600px; /* Tinggi tampilan di layar kecil */
            }
            .left-panel {
                border-right: none;
                border-bottom: 2px solid var(--border-color);
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>Modul & Evaluasi Sumatif TIK</h1>
            <p>Kelas 4 SD/MI — Pengolahan Kata & Format Dokumen Digital</p>
        </div>
    </header>

    <div class="main-layout">
        <!-- Panel Kiri: Iframe Google Docs Material -->
        <div class="left-panel">
            <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vQDgZhp_mbXlFxVxC2l2n11VoSqnz1B_uZMFcDkuba6jLzkiuni8PexX5m9ATcwQjzEfjtpwhUvPh1Z/embed?start=false&loop=false&delayms=60000" title="Materi Pembelajaran Google Docs"></iframe>
        </div>

        <!-- Panel Kanan: Iframe ZEP Quiz -->
        <div class="right-panel">
            <iframe src="https://quiz.zep.us/id/join" title="Kuis Interaktif ZEP Quiz" allow="fullscreen; autoplay"></iframe>
        </div>
    </div>

</body>
</html>
